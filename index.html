<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="style.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

</head>
<body>
  <header>
    <a href="#" class="logo">Roland</a>
    <nav>
      <a href="#" class="active">Home</a>
      <a href="#">Service</a>
      <a href="#">Skills</a>
      <a href="#">Education</a>
      <a href="#">Experience</a>
      <a href="#">Contact</a>
    </nav>
  </header>

<video autoplay muted loop id="bg-video">
  <source src="video.mp4" type="video/mp4">
  Your browser does not support the video tag.
</video>

  <section class="home">
    <div class="home-img" data-aos="fade-right">
      <img src="images/download.jpg" alt="Roland" />
    </div>
    <div class="home-content" data-aos="fade-up">
      <h1 class="typing" id="typing-title"></h1>
      <h3 class="typing" id="typing-subtitle"></h3>
      <p>
        I craft sleek, responsive websites that blend design and functionality. With a passion for clean code and cutting-edge tech, I turn ideas into immersive digital experiences. Let’s build something exceptional.
      </p>
       <div class="social-icons">
        <a href="https://www.youtube.com/"><i class="fab fa-youtube"></i></a>
        <a href="https://github.com/SungXjinwoo"><i class="fab fa-github"></i></a>
        <a href="https://www.pinterest.com" target="_blank"><i class="fab fa-pinterest"></i></a>
        <a href="https://web.facebook.com/home?_rdc=1&_rdr#"><i class="fab fa-facebook"></i></a>
        <a href="https://www.instagram.com/accounts/login/?hl=en"><i class="fab fa-instagram"></i></a>
      </div>
    </div>
    <a href="https://www.pinterest.com" target="_blank" class="view-more-btn">View More</a>
    <a href="mailto:rolandalexander1201@gmail.com" class="view-more-btn">Message Me</a>

  </section>
  <script>
    const title = "Hi, It's Roland";
    const subtitle = "WELCOME TO MY WEBSITE";
    
    let index1 = 0;
    let index2 = 0;
  
    function typeTitle() {
      document.getElementById("typing-title").textContent = title.slice(0, index1++);
      if (index1 <= title.length) {
        setTimeout(typeTitle, 100);
      } else {
        index1 = 0;
        setTimeout(typeTitle, 2500);
      }
    }
  
    function typeSubtitle() {
      document.getElementById("typing-subtitle").textContent = subtitle.slice(0, index2++);
      if (index2 <= subtitle.length) {
        setTimeout(typeSubtitle, 100);
      } else {
        index2 = 0;
        setTimeout(typeSubtitle, 2500);
      }
    }
  
    typeTitle();
    typeSubtitle();
  </script>
  

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>
</body>
</html>
